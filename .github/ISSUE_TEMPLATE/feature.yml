name: Feature Request
description: Suggest an improvement to Redock
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe what you want to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Redock to do?
      description: Describe how the feature should work. A screenshot or sketch is welcome for visual ideas.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried?
      description: Share any workaround or alternative you considered.
