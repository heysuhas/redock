name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    container: fedora:44
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with dms-version. qml-common is the dux-qml-common submodule commit of each release.
        include:
          - dms: 2.1.0
            qml-common: be3e16ca62866a749b34cfefe1aaed81cfe21e94
          - dms: 2.1.2
            qml-common: 0877466a25b8e191a865bf75d0e500de6351ae04
    env:
      DMS: ${{ matrix.dms }}
      QML_COMMON: ${{ matrix.qml-common }}
    steps:
      - name: Install build tools
        run: dnf -y install curl git gzip patch python3 qt6-qtshadertools ShellCheck tar
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check launch script
        run: shellcheck launch.sh
      - name: Build and test against Dux Shell
        shell: bash
        run: |
          set -euo pipefail
          stock=$(mktemp -d)
          trap 'rm -rf "$stock"' EXIT
          # Every supported version needs a matrix entry, and every entry must be supported.
          grep -qx "$DMS" dms-version
          while read -r version; do
            grep -qx -- "          - dms: $version" .github/workflows/ci.yml
          done < dms-version
          shell="dux-shell-$DMS.tar.gz"
          common="qml-common-$QML_COMMON.tar.gz"
          curl -fLsS "https://codeload.github.com/duxlabs-dev/dux-shell/tar.gz/refs/tags/v$DMS" -o "$stock/$shell"
          curl -fLsS "https://codeload.github.com/duxlabs-dev/dux-qml-common/tar.gz/$QML_COMMON" -o "$stock/$common"
          (
            cd "$stock"
            sums=$(grep -E "  ($shell|$common)\$" "$GITHUB_WORKSPACE/tests/upstream.sha256")
            [[ $(wc -l <<< "$sums") -eq 2 ]]
            sha256sum -c <<< "$sums"
          )
          mkdir "$stock/source"
          tar -xzf "$stock/$shell" -C "$stock/source" --strip-components=1
          tar -xzf "$stock/$common" -C "$stock/source/dux-qml-common" --strip-components=1
          REDOCK_STOCK_UI="$stock/source/quickshell" python3 -m unittest discover -s tests -v

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Archive and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          archive="redock-$TAG.tar.gz"
          git archive --format=tar.gz --prefix="redock-$TAG/" --output="$archive" HEAD
          sha256sum "$archive" > "$archive.sha256"
          gh release create "$TAG" "$archive" "$archive.sha256" --verify-tag --generate-notes
